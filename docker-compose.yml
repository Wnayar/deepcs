name: deepcs

# Phase 0 target: `docker compose up` brings up the whole system locally —
# five services, the Stats job, Postgres, Redis and the Firebase Auth emulator.
# No cloud account is involved and nothing here costs money.

# Shared by all six. `build` and `volumes` are NOT here: every service
# overrides both with its own SERVICE build-arg and its own src/ mount, and
# putting them in the anchor would only suggest they were inherited.
#
# Interpolation (${VAR:-default}) reads .env automatically if one exists, so
# `docker compose up` works with no .env file at all.
#
# DATABASE_URL is deliberately NOT here. Each service connects as its own
# Postgres role (ADR-09), so a shared default would be the one line that
# silently undoes the boundary every other part of phase 1 enforces. The
# services that need Postgres set their own; the Gateway needs none.
#
# There is deliberately no shared `environment:` here, and it is worth knowing
# why rather than adding one back. A YAML merge key is *shallow*: if a service
# declares its own `environment:`, the anchor's is discarded outright rather
# than merged into it. Every service below sets at least one variable of its
# own (its DATABASE_URL, or the Gateway's CORS_ORIGIN), so an anchored block
# would be silently dropped for all of them — the five common variables really
# do have to be repeated per service.
x-service: &service
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  # ── Data ───────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: deepcs
      POSTGRES_PASSWORD: deepcs
      POSTGRES_DB: deepcs
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Without this, the services start before Postgres accepts connections
      # and crash-loop on boot. `condition: service_healthy` above is what
      # makes `depends_on` mean "ready", not merely "started".
      test: ['CMD-SHELL', 'pg_isready -U deepcs -d deepcs']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  firebase-auth:
    build:
      context: ./docker/firebase-emulator
    ports:
      - '9099:9099' # Auth emulator API
      - '4000:4000' # Emulator UI — browse and create test users here
    volumes:
      # Where the emulator writes its accounts on shutdown and reads them back
      # on start. Without it every rebuild of a service that depends on this
      # one takes your test accounts with it.
      - firebase-data:/srv/state
    # The export happens during shutdown, so the emulator needs long enough to
    # write it before Docker's SIGKILL. The default 10s is usually enough; this
    # makes it not a race.
    stop_grace_period: 30s
    healthcheck:
      # 127.0.0.1, never `localhost`. Inside this container `localhost`
      # resolves to ::1 first, and the emulator binds IPv4 0.0.0.0 only — so a
      # `localhost` probe gets ECONNREFUSED from a perfectly healthy emulator,
      # and every service that depends on it refuses to start.
      #
      # Grepping the body rather than just checking the port is open: the root
      # endpoint returns {"authEmulator":{"ready":true}} only once it can
      # actually mint tokens.
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9099/ | grep -q ready']
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Schema and roles ───────────────────────────────────────────────────────
  # Runs to completion before any service starts, so no service can race a
  # half-migrated database. Connects as the owner (`deepcs`), which is the one
  # role permitted to create schemas and hand out grants — exactly what the
  # service roles below are forbidden from doing.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        SERVICE: users # any: the dev stage copies the whole repo
    command: ['pnpm', '--filter', '@deepcs/db', 'migrate']
    environment:
      DATABASE_URL: postgresql://deepcs:deepcs@postgres:5432/deepcs
    volumes:
      # The migrations and the runner, not the whole package. Mounting
      # `./packages/db` overlays the image's `node_modules` with the host's, and
      # pnpm then decides the workspace needs reinstalling before it will run a
      # script — into a read-only mount, so it exits 1 and every service waiting
      # on `service_completed_successfully` never starts. Every other service
      # here mounts only `src` for the same reason.
      - ./packages/db/migrations:/app/packages/db/migrations:ro
      - ./packages/db/migrate.mjs:/app/packages/db/migrate.mjs:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # ── Services (DESIGN.md §3) ────────────────────────────────────────────────
  gateway:
    <<: *service
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        SERVICE: gateway
    # No DATABASE_URL: the Gateway has no domain data (§6), which is also why
    # authorization cannot live here.
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-deepcs}
      FIREBASE_AUTH_EMULATOR_HOST: firebase-auth:9099
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - '8080:8080'
    volumes:
      - ./packages/shared/src:/app/packages/shared/src:ro
      - ./services/gateway/src:/app/services/gateway/src:ro
    depends_on:
      redis:
        condition: service_healthy
      firebase-auth:
        condition: service_healthy

  users:
    <<: *service
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        SERVICE: users
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-deepcs}
      FIREBASE_AUTH_EMULATOR_HOST: firebase-auth:9099
      # Its own role, with USAGE on the `users` schema and nothing else.
      # Querying matching.* from here is refused by Postgres (ADR-09).
      DATABASE_URL: postgresql://users_svc:users_svc@postgres:5432/deepcs
    ports:
      - '8081:8081'
    volumes:
      - ./packages/shared/src:/app/packages/shared/src:ro
      - ./services/users/src:/app/services/users/src:ro

  questions:
    <<: *service
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        SERVICE: questions
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-deepcs}
      FIREBASE_AUTH_EMULATOR_HOST: firebase-auth:9099
      DATABASE_URL: postgresql://questions_svc:questions_svc@postgres:5432/deepcs
    ports:
      - '8082:8082'
    volumes:
      - ./packages/shared/src:/app/packages/shared/src:ro
      - ./services/questions/src:/app/services/questions/src:ro

  matching:
    <<: *service
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        SERVICE: matching
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-deepcs}
      FIREBASE_AUTH_EMULATOR_HOST: firebase-auth:9099
      DATABASE_URL: postgresql://matching_svc:matching_svc@postgres:5432/deepcs
      # Internal service-to-service calls (clients.ts), reached by compose's
      # service-name DNS — not through the Gateway, since these are
      # server-to-server, not client-facing.
      USERS_URL: http://users:8081
      QUESTIONS_URL: http://questions:8082
    ports:
      - '8083:8083'
    volumes:
      - ./packages/shared/src:/app/packages/shared/src:ro
      - ./services/matching/src:/app/services/matching/src:ro

  collab:
    <<: *service
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        SERVICE: collab
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-deepcs}
      FIREBASE_AUTH_EMULATOR_HOST: firebase-auth:9099
      DATABASE_URL: postgresql://collab_svc:collab_svc@postgres:5432/deepcs
      # Internal service-to-service calls (clients.ts), reached by compose's
      # service-name DNS — not through the Gateway, since these are
      # server-to-server, not client-facing.
      MATCHING_URL: http://matching:8083
      QUESTIONS_URL: http://questions:8082
    ports:
      - '8084:8084'
    volumes:
      - ./packages/shared/src:/app/packages/shared/src:ro
      - ./services/collab/src:/app/services/collab/src:ro

  # ── The job ────────────────────────────────────────────────────────────────
  # Stats is expected to show as `exited (0)` seconds after `up`. That is not a
  # failure — it is the whole point (DESIGN.md §5). In production Cloud
  # Scheduler invokes it every 5 minutes; locally, run it on demand with
  #   docker compose run --rm stats
  stats:
    <<: *service
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        SERVICE: stats
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-deepcs}
      FIREBASE_AUTH_EMULATOR_HOST: firebase-auth:9099
      DATABASE_URL: postgresql://stats_svc:stats_svc@postgres:5432/deepcs
    volumes:
      - ./packages/shared/src:/app/packages/shared/src:ro
      - ./services/stats/src:/app/services/stats/src:ro
    restart: 'no'

volumes:
  firebase-data:
  pgdata:
