# One Worker serves the SPA and free content as static assets and runs only
# for /api/* and paid content.

name = "deepcs"
main = "src/worker/index.ts"
compatibility_date = "2025-09-06"

[assets]
directory = "dist/client"
binding = "ASSETS"
# Unknown paths get index.html with a 200: every screen is a URL, and the
# router exists only once the bundle runs.
not_found_handling = "single-page-application"
# These paths always run the Worker, so paid files are never served by the
# platform directly.
run_worker_first = ["/api/*", "/content/paid/*"]

[[d1_databases]]
binding = "DB"
database_name = "deepcs"
# Set by `wrangler d1 create deepcs` before the first deploy; local dev and
# tests never read it.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# Public identifier; production overrides at deploy time. Secrets
# (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET) are set with `wrangler secret
# put`, and STRIPE_PRICE_ID is a deploy-time var.
FIREBASE_PROJECT_ID = "demo-deepcs"
