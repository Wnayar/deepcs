packages:
  - 'services/*'
  - 'packages/*'
  # The frontend sits at the top level rather than under packages/, and the
  # reason is CI: the `changes` job treats any edit under packages/ as "a
  # shared file changed, rebuild everything", so every UI tweak would rebuild
  # and image-smoke-test all six backend services. It is not under services/
  # either — that matrix assumes each entry is a Docker-buildable server with a
  # /health/ready endpoint, and this is a static bundle.
  - 'frontend'
  # The k6 load test. A workspace package only so that the Yjs
  # libraries it bundles into the k6 script come from the same catalog
  # versions Collab itself runs — a load generator speaking a different
  # protocol version to the server would measure something that does not
  # exist. It is not a service and builds no image.
  - 'load'

# pnpm blocks dependency install scripts by default (a supply-chain control:
# a compromised transitive package cannot run code on install). esbuild is an
# explicit exception — its postinstall is what puts the platform-native binary
# in place, and tsup and vitest are both dead without it.
allowBuilds:
  esbuild: true
  # Both arrived with the Firebase web SDK and both are declined. protobufjs
  # comes in transitively via Firestore, which this app does not use — only
  # Auth — and @firebase/util's script is not needed for a bundle Vite builds
  # from source. Declining is the default this list exists to make explicit;
  # if something turns out to need them, that is a deliberate change with a
  # reason attached rather than a silent yes.
  '@firebase/util': false
  protobufjs: false

# One version of each dependency across seven package.json files. Without a
# catalog, six services drift onto six Fastify versions and the shared types in
# packages/shared stop matching some of them.
catalog:
  '@types/node': ^24.3.0
  fastify: ^5.6.0
  pino: ^9.9.0
  tsup: ^8.5.0
  tsx: ^4.20.5
  typescript: ^5.9.2
  vitest: ^3.2.4

  # ── gateway and users ──────────────────────────────────────────────────────
  # jose, not firebase-admin: verification needs only Google's public keys, so
  # the Gateway holds no service-account credential and cannot mint or revoke a
  # token (docs/system/01-gateway.md). createRemoteJWKSet also does the fetch,
  # the cache and
  # the key-rotation that Firebase requires, which is the whole JWKS story.
  jose: ^6.1.0
  ioredis: ^5.8.2
  pg: ^8.16.3
  '@types/pg': ^8.15.5
  zod: ^4.1.5
  '@fastify/cors': ^11.1.0
  '@fastify/helmet': ^13.0.2
  '@fastify/http-proxy': ^11.3.0

  # ── collab ─────────────────────────────────────────────────────────────────
  # yjs + y-protocols (not the y-websocket server package): the sync and
  # awareness wire protocols are used directly so the room map, the
  # cross-instance Redis relay and Postgres snapshotting are first-class code
  # here rather than bolted onto someone else's connection bookkeeping
  # (docs/system/05-collab.md — "the learning is in the sync topology").
  yjs: ^13.6.32
  y-protocols: ^1.0.7
  lib0: ^0.2.117
  '@fastify/websocket': ^11.3.0
  ws: ^8.21.3
  '@types/ws': ^8.18.1

  # ── frontend ───────────────────────────────────────────────────────────────
  # The browser half. `firebase` is the web SDK — the client that *obtains* a
  # token, as opposed to the Gateway's `jose`, which only verifies one; the two
  # never swap roles. `y-monaco` is the binding between the Yjs document the
  # Collab service already serves and the editor, and it renders remote cursors
  # from Yjs awareness for free, which is why presence needs no code of its own.
  react: ^19.2.8
  react-dom: ^19.2.8
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  vite: ^8.2.1
  '@vitejs/plugin-react': ^6.0.5
  firebase: ^12.17.1
  # Lessons are markdown; `marked` turns them into HTML. It is not a
  # sanitizer and does not need to be: the bodies are seeded by a migration
  # from our own notes, never user input, and the page's CSP forbids inline
  # script regardless of what any renderer emits.
  marked: ^18.0.9
  # Colours the code blocks inside those lessons. Core plus four grammars, not
  # the "load every language" build, because the seeds only ever contain
  # Python, SQL, CQL and C. No theme stylesheet is imported: Prism's themes are
  # hard-coded hex, and colours here live in `:root` custom properties so light
  # and dark stay two lists of variables rather than two stylesheets.
  prismjs: ^1.30.0
  # A DOM for the editor test. The shared editor is the one piece of UI with a
  # contract that can break silently: it binds a CodeMirror view to a Yjs text,
  # and a swap of either side compiles fine while syncing nothing. Dev only,
  # never shipped.
  jsdom: ^28.0.1
  '@types/prismjs': ^1.26.5
  # URLs for the screens. The app navigated with a `useState` switch until now,
  # which meant one history entry for the whole site: the browser Back button
  # left it entirely, refreshing lost your place, and no lesson could be linked
  # to. Hand-rolling this on the History API is about sixty lines, but a router
  # is load-bearing rather than a leaf, and its failure modes (double history
  # entries, state out of step with the URL, back landing on a screen whose data
  # was never fetched) are the tedious kind to find.
  react-router: ^8.3.0
  # CodeMirror, not Monaco. The shared document is prose: no highlighting, no
  # language services, no IntelliSense. What is actually used is an editing
  # surface, selections, and somewhere to draw the other person's caret, which
  # is a small fraction of an editor built for code and priced accordingly.
  '@codemirror/commands': ^6.8.1
  '@codemirror/state': ^6.5.2
  '@codemirror/view': ^6.38.1
  'y-codemirror.next': ^0.3.5
  # The reading face for lessons, bundled from node_modules by Vite so the app
  # stays self-contained: no font CDN, nothing fetched at runtime. The system
  # UI stack it replaces is designed for menus and buttons, not paragraphs.
  '@fontsource-variable/inter': ^5.2.0
