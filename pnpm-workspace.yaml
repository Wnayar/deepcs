# No workspace members; this file only carries pnpm settings.
#
# Install scripts are blocked by default (a supply-chain control). esbuild
# and workerd need theirs to place native binaries; @firebase/util,
# protobufjs, and sharp arrive transitively and are declined because nothing
# here uses what their scripts build.
allowBuilds:
  esbuild: true
  workerd: true
  '@firebase/util': false
  protobufjs: false
  sharp: false

# One esbuild for the whole tree: wrangler pins 0.28.1 exactly while vite
# floats a patch ahead, and two copies buy nothing but install races.
overrides:
  esbuild: 0.28.1
