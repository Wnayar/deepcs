# One package, no workspace members: this file exists only to carry the
# install-script policy below.
#
# pnpm blocks dependency install scripts by default (a supply-chain control:
# a compromised transitive package cannot run code on install). esbuild's
# postinstall places its platform-native binary, and workerd is wrangler's
# runtime binary — both are dead without theirs. @firebase/util and
# protobufjs arrive with the Firebase web SDK and are deliberately declined:
# only Auth is used, and a bundle Vite builds from source needs neither
# script. Declining is the default this list exists to make explicit.
allowBuilds:
  esbuild: true
  workerd: true
  '@firebase/util': false
  protobufjs: false
  # Transitive via the workers tooling; image processing this app never
  # does, so its native build stays off.
  sharp: false

# One esbuild for the whole tree. wrangler pins 0.28.1 exactly while vite
# floats a patch ahead, and pnpm installed the floated version without its
# platform binary — two esbuilds buy nothing but that failure, so both ride
# wrangler's pin.
overrides:
  esbuild: 0.28.1
