name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Which services actually changed? ─────────────────────────────────────────
  # the overview §7 wants CI path-filtered per service: a change under
  # services/questions/ builds only Questions. Independent deployability is most
  # of the point of the six-way split (ADR-01) and it does not exist unless the
  # pipeline is wired for it.
  #
  # Done with plain git rather than a marketplace action so every step is
  # visible — this is the job that decides what actually gets rebuilt.
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      count: ${{ steps.detect.outputs.count }}
      web: ${{ steps.detect.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          ALL='["gateway","users","questions","matching","collab","stats"]'

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          else
            base=""   # first push on a branch: no diff base, build everything
          fi

          if [ -z "$base" ]; then
            echo "no diff base — building all services"
            echo "services=$ALL" >> "$GITHUB_OUTPUT"
            echo "count=6" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" HEAD)
          echo "changed files:"; echo "$changed"

          # The frontend is decided on its own, not as a matrix entry. The
          # matrix builds a Docker image per service and polls /health/ready,
          # and a static bundle has neither. Computed before the early exit
          # below, which returns without reaching the rest of this script.
          if echo "$changed" | grep -qE '^(frontend/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.base\.json|\.github/workflows/)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

          # Anything shared rebuilds everything: packages/shared is compiled
          # into all six images, and the root config, Dockerfile and lockfile
          # define how every one of them is built. Skipping a service here
          # because "only the Dockerfile changed" is how a broken image reaches
          # production untested.
          if echo "$changed" | grep -qE '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.base\.json|Dockerfile|\.dockerignore|packages/|\.github/workflows/)'; then
            echo "shared file touched — building all services"
            echo "services=$ALL" >> "$GITHUB_OUTPUT"
            echo "count=6" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `|| true` is braced so it applies to grep ALONE. grep exits 1 when it
          # matches nothing — which is exactly what a docs-only commit looks
          # like — and under `set -o pipefail` that status survives to the
          # assignment, where `set -e` kills the step before the count=0 guard
          # below can ever be used. Appending `|| true` to the whole pipeline
          # instead would also swallow a real cut/jq failure and hand the matrix
          # a silently empty list.
          selected=$(echo "$changed" \
            | { grep -oE '^services/[^/]+' || true; } \
            | cut -d/ -f2 \
            | sort -u \
            | jq -R . | jq -sc .)
          [ "$selected" = "" ] && selected='[]'

          echo "services=$selected" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$selected" | jq 'length')" >> "$GITHUB_OUTPUT"

  # ── Repo-wide checks: run once, not six times ────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

      # The per-service matrix below only ever runs `--filter @deepcs/<service>`,
      # so nothing in packages/ is covered by it. createService is compiled into
      # all six images, which makes it the least acceptable place to have no
      # tests. It needs no Postgres or Redis — it asserts on app.inject alone —
      # so it belongs here rather than in the matrix job that provisions both.
      - run: pnpm --filter @deepcs/shared test

  # ── The frontend: typecheck and build, and nothing else ──────────────────────
  # Deliberately not an entry in the matrix below. That job builds a container
  # image per service and proves it answers /health/ready; the frontend is a
  # static bundle with no image, no port and no health endpoint, so it would
  # need a third special case in a step that already has one for Stats.
  #
  # No Postgres or Redis either — nothing here touches them. What this does
  # catch is the failure that actually happens: a type error, or a Monaco or
  # Firebase import that resolves in the editor and not in a real build.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deepcs/web typecheck
      # The collab client's tests need the whole stack and the Auth emulator,
      # which this job does not stand up — they detect that and skip rather
      # than fail. Run for the same reason the contract tests are: so a change
      # that breaks them locally is caught by someone, and so the step exists
      # the day CI does orchestrate the services.
      - run: pnpm --filter @deepcs/web test
      - run: pnpm --filter @deepcs/web build

  # ── Per-service: typecheck, test, build, and build the image ─────────────────
  service:
    needs: changes
    if: needs.changes.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    name: ${{ matrix.service }}

    # Real Postgres and Redis, not mocks (§8). The two things phase 1 must
    # prove — a Lua script's atomicity, and a role being refused another
    # schema — are properties of those systems. A mock would only prove the
    # mock agrees with itself.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: deepcs
          POSTGRES_PASSWORD: deepcs
          POSTGRES_DB: deepcs
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U deepcs -d deepcs"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://deepcs:deepcs@127.0.0.1:5432/deepcs
      USERS_DATABASE_URL: postgresql://users_svc:users_svc@127.0.0.1:5432/deepcs
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Schema and roles before the tests that assert on them. Idempotent, so
      # running it in all six jobs costs a few seconds and keeps each job
      # self-contained rather than ordered behind a shared setup job.
      - name: migrate
        run: pnpm --filter @deepcs/db migrate

      - name: typecheck
        run: pnpm --filter "@deepcs/${{ matrix.service }}" typecheck

      - name: test
        run: pnpm --filter "@deepcs/${{ matrix.service }}" test

      - name: build
        run: pnpm --filter "@deepcs/${{ matrix.service }}" build

      # The image build is not redundant with the steps above: it is the only
      # thing that exercises the pnpm-symlink / tsup-bundling path that makes
      # the runtime image work at all. A service that compiles and still
      # produces a dead image is exactly the failure this catches.
      # Required by the `cache-to: type=gha` below. A runner's default builder
      # uses the `docker` driver, which cannot export a cache at all — the build
      # fails with "Cache export is not supported for the docker driver" before
      # it starts. This action creates a `docker-container` builder, which can.
      - uses: docker/setup-buildx-action@v3

      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          build-args: SERVICE=${{ matrix.service }}
          push: false
          load: true
          tags: deepcs/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Proves the image actually starts, rather than only that it built.
      # Stats is a job: it runs to completion and exits 0, so it is checked
      # differently from the five servers.
      - name: smoke test the image
        run: |
          set -euo pipefail
          if [ "${{ matrix.service }}" = "stats" ]; then
            # The default entrypoint is the job: it drains and exits 0. The same
            # image also serves reads under a different command, so both are
            # checked, because "the image builds" would not have caught either
            # of them failing to start.
            docker run --rm --network host \
              -e DATABASE_URL=postgresql://deepcs:deepcs@127.0.0.1:5432/deepcs \
              -e REDIS_URL=redis://127.0.0.1:6379 \
              deepcs/stats:ci

            # And the read server, which is the same image under a different
            # command and so is not covered by the run above.
            id=$(docker run -d --network host \
              -e DATABASE_URL=postgresql://deepcs:deepcs@127.0.0.1:5432/deepcs \
              -e PORT=8085 \
              deepcs/stats:ci node services/stats/dist/server.js)
            for _ in $(seq 1 30); do
              curl -fsS http://127.0.0.1:8085/health/ready && break || sleep 1
            done
            curl -fsS http://127.0.0.1:8085/health/ready
            docker rm -f "$id" > /dev/null
          else
            # --network host, not -p: the image has to reach the Postgres and
            # Redis *service containers*, and inside a bridged container
            # 127.0.0.1 is that container itself, not the runner. Sharing the
            # runner's network stack makes 127.0.0.1:5432 mean what the env
            # vars above say it means.
            #
            # The env vars are not decoration. From phase 1 the services refuse
            # to start without their config — createPool throws on a missing
            # DATABASE_URL, createVerifier on a missing FIREBASE_PROJECT_ID —
            # which is deliberate, and which this step has to satisfy for the
            # same reason a real deployment does. NODE_ENV=production is baked
            # into the runner stage, so the emulator guard is also live here:
            # setting FIREBASE_AUTH_EMULATOR_HOST would make the Gateway refuse
            # to boot, exactly as intended.
            # USERS_URL/QUESTIONS_URL/MATCHING_URL only need to be non-empty
            # here — Matching (Users, Questions) and Collab (Matching,
            # Questions) check for their presence at boot (same fail-fast
            # pattern as DATABASE_URL) but never dereference them, since
            # /health/ready doesn't call out to another service. Sibling
            # services ignore the vars entirely. Omitting any one of them makes
            # that service's container exit 1 before it ever listens.
            docker run -d --name smoke --network host \
              -e PORT=8080 \
              -e DATABASE_URL="$DATABASE_URL" \
              -e REDIS_URL="$REDIS_URL" \
              -e FIREBASE_PROJECT_ID=demo-deepcs \
              -e USERS_URL=http://localhost:8081 \
              -e QUESTIONS_URL=http://localhost:8082 \
              -e MATCHING_URL=http://localhost:8083 \
              deepcs/${{ matrix.service }}:ci
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8080/health/ready; then ok=1; break; fi
              sleep 1
            done
            docker logs smoke
            docker rm -f smoke
            [ "${ok:-0}" = "1" ]
          fi

    # There is no deploy step, and there is not going to be one: this project
    # runs locally, under docker compose and on a local Kubernetes cluster
    # (the overview §7). What this job proves is that each service's production
    # image builds and answers /health/ready on its own, which is the property
    # a rolling update on the cluster depends on.
